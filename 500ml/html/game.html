<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../css/gamestyle.css">
        <title>500ml - プレイ</title>
    </head>

    <body id="body">
        <div id="gameelement">
            <!-- カウントダウンをするタグ -->
            <div id="countdown">5</div>
            <!-- 残り回数を表示するタグ -->
            <div id="rest">○ ○ ○ ○ ○ ○</div>
            <!-- 目標値を表示するタグ -->
            <div id="goal">click</div>
        </div>

        <!-- スコアを表示するタグ -->
        <div id="scoretext"></div>
        <div id="scorenum"></div>

        <!-- 波の表現を行うタグ -->
        <svg version="1.1" xmlns="http://www.w3.org/2000/svg"><path id="wave" d=""/></svg>

        <!-- javascript -->
        <script src="../js/jquery.js"></script>
        <script src="../js/tweenmax.js"></script>
        <script src="../js/wavify.js"></script>
        <script src="../js/gamescript.js"></script>
    </body>

</html>
